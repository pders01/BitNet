<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BitNet Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="h-dvh flex overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-60 bg-base-200 flex flex-col shrink-0">
    <div class="p-2">
      <button id="new-chat" class="btn btn-ghost btn-sm w-full justify-start gap-2 font-normal">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        New chat
      </button>
    </div>

    <ul id="conv-list" class="menu menu-sm flex-1 overflow-y-auto px-2 gap-0.5 w-full"></ul>

    <div class="p-3 border-t border-base-content/10 space-y-2">
      <select id="theme-select" class="select select-xs w-full">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
      <div class="flex items-center gap-2 text-xs text-base-content/40">
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-success"></span>
        BitNet 2.4B · 1.58-bit
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 flex flex-col min-w-0">
    <!-- Header -->
    <div class="h-12 flex items-center justify-between px-4 border-b border-base-content/10 shrink-0">
      <h1 id="conv-title" class="text-sm font-medium truncate text-base-content/70">Select or start a conversation</h1>
      <div class="flex items-center gap-3">
        <!-- Context window bar -->
        <div id="context-bar" class="flex items-center gap-2 text-xs text-base-content/50 hidden">
          <span id="context-label">0 / 4096</span>
          <div class="w-24 h-1.5 bg-base-200 rounded-full overflow-hidden">
            <div id="context-fill" class="h-full bg-primary rounded-full transition-all" style="width: 0%"></div>
          </div>
        </div>
        <!-- Settings toggle -->
        <button id="settings-toggle" class="btn btn-ghost btn-xs btn-square" title="Settings">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <!-- Settings panel (collapsible) -->
    <div id="settings-panel" class="hidden border-b border-base-content/10 bg-base-200/50">
      <div class="max-w-3xl mx-auto px-6 py-4 space-y-4">
        <!-- Presets -->
        <div class="flex items-center gap-2">
          <span class="text-xs font-medium text-base-content/60 w-20 shrink-0">Preset</span>
          <div class="flex gap-1.5">
            <button class="preset-btn btn btn-xs" data-preset="precise">Precise</button>
            <button class="preset-btn btn btn-xs" data-preset="balanced">Balanced</button>
            <button class="preset-btn btn btn-xs" data-preset="creative">Creative</button>
            <button class="preset-btn btn btn-xs" data-preset="coder">Coder</button>
          </div>
        </div>
        <!-- Temperature -->
        <div class="flex items-center gap-2">
          <span class="text-xs font-medium text-base-content/60 w-20 shrink-0">Temp</span>
          <input id="temp-slider" type="range" min="0" max="1.5" step="0.1" value="0.7" class="range range-xs range-primary flex-1" />
          <span id="temp-value" class="text-xs font-mono w-8 text-right">0.7</span>
        </div>
        <!-- System prompt -->
        <div class="flex items-start gap-2">
          <span class="text-xs font-medium text-base-content/60 w-20 shrink-0 pt-1">System</span>
          <textarea
            id="system-prompt"
            rows="2"
            class="textarea textarea-bordered textarea-xs flex-1 text-xs leading-5 resize-none"
            style="field-sizing: content; max-height: 120px;"
            placeholder="You are a helpful assistant."
          ></textarea>
        </div>
      </div>
    </div>

    <!-- Messages -->
    <div id="messages" class="flex-1 overflow-y-auto">
      <div id="msg-inner" class="max-w-3xl mx-auto px-6 py-6 space-y-1"></div>
      <div id="empty-state" class="flex items-center justify-center h-full">
        <span class="text-base-content/25 text-sm">Start a new conversation</span>
      </div>
    </div>

    <!-- Input -->
    <div class="px-6 pb-6 pt-4">
      <div class="max-w-3xl mx-auto flex items-end gap-2">
        <textarea
          id="input"
          rows="1"
          placeholder="Message BitNet..."
          class="textarea bg-base-200 border-none flex-1 text-sm leading-6 resize-none focus:outline-none"
          style="min-height: 48px; max-height: 160px; field-sizing: content;"
          autofocus
        ></textarea>
        <button id="send" class="btn btn-primary h-12 min-h-12">Send</button>
      </div>
    </div>
  </main>

  <!-- Rename modal -->
  <dialog id="rename-modal" class="modal">
    <div class="modal-box bg-neutral w-80">
      <h3 class="text-lg font-bold mb-4">Rename conversation</h3>
      <input id="rename-input" type="text" class="input input-bordered w-full" />
      <div class="modal-action">
        <button id="rename-cancel" class="btn btn-ghost btn-sm">Cancel</button>
        <button id="rename-confirm" class="btn btn-sm">Save</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <!-- Delete confirm modal -->
  <dialog id="delete-modal" class="modal">
    <div class="modal-box bg-neutral w-80">
      <h3 class="text-lg font-bold">Delete conversation?</h3>
      <p class="py-4 text-sm opacity-50">This cannot be undone.</p>
      <div class="modal-action">
        <button id="delete-cancel" class="btn btn-ghost btn-sm">Cancel</button>
        <button id="delete-confirm" class="btn btn-error btn-sm">Delete</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
